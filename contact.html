    <script>
const COLOURS = ['blue', 'pink', 'orange', 'green'];

function nextColour(current) {
  const idx = COLOURS.indexOf(current);
  return COLOURS[(idx + 1) % COLOURS.length];
}

// Map colour names to your actual CSS values
const CSS_VALUES = {
  blue:   { full: '#1696ff', medium: 'rgba(22, 150, 255, 0.5)', light: 'rgba(22, 150, 255, 0.3)'},
  pink:   { full: '#d51553', medium: 'rgb(213, 21, 83, 0.5)', light: 'rgb(213, 21, 83, 0.3)'},
  orange:  { full: '#E6600C', medium: 'rgb(230, 96, 12, 0.5)', light: 'rgb(230, 96, 12, 0.3)'},
  green:   { full: '#5c9e00', medium: 'rgb(92, 158, 0, 0.5)', light: 'rgb(92, 158, 0, 0.3)'},
};

function applyColour(colour) {
  document.documentElement.style.setProperty('--blue', CSS_VALUES[colour].full);
  document.documentElement.style.setProperty('--blue-medium', CSS_VALUES[colour].medium);
  document.documentElement.style.setProperty('--blue-light', CSS_VALUES[colour].light);

  document.querySelectorAll('img[src*="/SVG/Envelope_"]').forEach(img => {
    img.src = img.src.replace(/Envelope_\w+\.svg/, `Envelope_${colour.charAt(0).toUpperCase() + colour.slice(1)}.svg`);
  });
}


// ── Run on every page: just read and apply, don't advance ──
const saved = localStorage.getItem('accentColour') || 'blue';
applyColour(saved);
</script>
