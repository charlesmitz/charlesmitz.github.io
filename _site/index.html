        <style>
.row {
  display: flex;
  flex-wrap: wrap;
  padding: 0 4px;
}

/* Create two equal columns that sits next to each other */
.column {
  flex:50%;
  max-width: 50%;
  padding: 0 4px;
}

.column img {
  animation: fadeInAnimation ease 1.3s;
            animation-iteration-count: 1;
            animation-fill-mode: forwards;
  margin-top: 8px;
  vertical-align: middle;
  opacity: 1;
}

.image-holder{
  margin-top: 8px;
  margin-bottom: -28pt;
}

.image-holder img{
  margin-top: 0px;
  margin-bottom: 0px;
  vertical-align: middle;
  opacity: 1;
  filter: blur(0px);
  filter: brightness(1);
  transition: all 0.3s ease;
  z-index: 1;
  border-radius: 22px;
}

.image-holder .text{
  margin-top: 0px;
  margin-bottom: 0px;
  padding: 4px;
  position:relative;
  bottom: 44px;
  left:8px;
  color: white;
  opacity: 0;
  transition: opacity 0.3s ease;
  visibility:hidden;
}

.image-holder:hover img{
  filter: blur(2px);
  filter: brightness(.2);
  }

.image-holder:hover .text{
  visibility:visible;
  opacity: 100%;
}


@keyframes fadeInAnimation {
            0% {
              transform: translateX(-50%);
                opacity: 0;
            }

            100% {
              transform:translateX(0%);
                opacity: 1;
            }
          }

/* Responsive layout - makes the two columns stack on top of each other instead of next to each other */
@media (max-width: 600px) {
  .column {
    flex: 100%;
    max-width: 100%;
  }
}

</style>
